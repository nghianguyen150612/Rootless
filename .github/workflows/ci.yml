name: P4 native build and VFS smoke
on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Probe smoke test
        run: ./build/rl probe --verbose
      - name: Native feasibility (host-specific)
        run: ./build/rl native-probe
      - name: Require native execution coverage
        run: test -x build/native_fixture && ctest --test-dir build -R native_execution --verbose
      - name: Require seccomp interception coverage
        run: test -x build/intercept_fixture && ctest --test-dir build -R seccomp_user_notif_intercept --verbose
      - name: Require experimental VFS coverage
        run: python3 tests/vfs_smoke.py ./build/rl ./build/vfs_fixture
      - name: Android status
        run: echo 'Android/Termux NOT_RUN - real hardware required'
      - name: Validate Termux packaging script syntax
        run: sh -n packaging/termux/build-deb.sh

  alpine-arm64:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 10
    env:
      CC: gcc
      ALPINE_ARCHIVE: alpine-minirootfs-3.23.8-aarch64.tar.gz
      ALPINE_SHA256: 3f1bd6811370264cc363bb991ff15ac67621b239ea6e25ff2eb22af3d0641473
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Fetch Alpine AArch64 minirootfs
        run: |
          test "$(uname -m)" = aarch64
          curl -fsSLO --retry 3 "https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/aarch64/$ALPINE_ARCHIVE"
          printf '%s  %s\n' "$ALPINE_SHA256" "$ALPINE_ARCHIVE" | sha256sum -c -
          mkdir alpine
          tar -xzf "$ALPINE_ARCHIVE" -C alpine --no-same-owner
      - name: Launch Alpine shell as unprivileged runner user
        run: |
          ./build/rl native-probe
          python3 tests/alpine_shell_smoke.py ./build/rl ./alpine
      - name: Compare userspace VFS with kernel chroot on native ARM64
        run: python3 tests/vfs_smoke.py ./build/rl ./build/vfs_fixture --arm64-reference

      - name: Fetch pinned Alpine static BusyBox
        run: |
          curl -fsSLo busybox-static.apk --retry 3 https://dl-cdn.alpinelinux.org/alpine/v3.23/main/aarch64/busybox-static-1.37.0-r30.apk
          printf '%s  %s\n' 44c9abdfb970f398fa72c8382fe2d8808eea16beaf82daf6ac708b92f1b8659e busybox-static.apk | sha256sum -c -
          mkdir busybox-root
          tar -xzf busybox-static.apk -C busybox-root --no-same-owner bin/busybox.static
      - name: Run real static BusyBox under experimental VFS
        run: python3 tests/busybox_smoke.py ./build/rl ./busybox-root/bin/busybox.static
