name: P0 native build and tests
on:
  push:
  pull_request:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: CTest
        run: ctest --test-dir build --output-on-failure
      - name: Probe smoke test
        run: ./build/rl probe --verbose
      - name: Validate Termux packaging script syntax
        run: sh -n packaging/termux/build-deb.sh
